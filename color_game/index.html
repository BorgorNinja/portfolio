<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Perya Color Game 3D • Philippine Fiesta Carnival Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/cannon.min.js"></script>
  <style>
    :root {
      --bg: #070a12;
      --gold: #facc15;
      --gold-dark: #ca8a04;
      --wood-dark: #271406;
      --font-display: 'Cinzel', serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: #f8fafc;
      font-family: var(--font-sans);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Navigation Header */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 56px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(7, 10, 18, 0.95) 0%, rgba(7, 10, 18, 0.7) 80%, transparent 100%);
      backdrop-filter: blur(8px);
      z-index: 50;
      border-bottom: 1px solid rgba(250, 204, 21, 0.15);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav-back {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .btn-nav-back:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #fff;
    }

    .game-logo-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--gold);
      text-shadow: 0 0 14px rgba(250, 204, 21, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-hud-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-balance-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(250, 204, 21, 0.4);
      padding: 5px 14px;
      border-radius: 20px;
      font-family: var(--font-mono);
      font-weight: 800;
      color: #fde047;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.15);
      font-size: 0.9rem;
    }

    .btn-hud-icon {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-hud-icon:hover {
      background: rgba(250, 204, 21, 0.2);
      border-color: var(--gold);
      color: #fff;
    }

    /* 3D WebGL Canvas Container */
    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Multi-Player Seat Ribbon (Up to 4 Players) */
    .seats-container {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 960px;
      z-index: 30;
    }
    .seats-ribbon {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .seat-card {
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.92) 0%, rgba(10, 14, 26, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      user-select: none;
    }
    .seat-card:hover {
      transform: translateY(-2px);
      border-color: rgba(250, 204, 21, 0.5);
      background: linear-gradient(180deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.98) 100%);
    }
    .seat-card.active-user {
      border-color: #f59e0b;
      background: linear-gradient(180deg, rgba(40, 32, 12, 0.95) 0%, rgba(20, 16, 8, 0.98) 100%);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.35);
    }
    .seat-card.open-seat {
      opacity: 0.65;
      border-style: dashed;
    }
    .seat-card.open-seat:hover {
      opacity: 1;
      border-style: solid;
    }
    .seat-card.winner-glow {
      border-color: #4ade80 !important;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.6) !important;
      animation: seatPulse 0.6s infinite alternate;
    }
    @keyframes seatPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }
    .seat-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .seat-avatar {
      font-size: 1.15rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .seat-name {
      font-size: 0.78rem;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100px;
    }
    .seat-status {
      font-size: 0.66rem;
      font-weight: 600;
      color: #94a3b8;
    }
    .seat-card.active-user .seat-status {
      color: #facc15;
    }
    .seat-bet-val {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 800;
      color: #94a3b8;
      text-align: right;
    }
    .seat-card.active-user .seat-bet-val {
      color: #38bdf8;
    }
    .seat-chip-dots {
      display: flex;
      gap: 3px;
      margin-top: 2px;
      justify-content: flex-end;
    }
    .chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .btn-hud-icon.btn-leave {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }
    .btn-hud-icon.btn-leave:hover {
      background: rgba(239, 68, 68, 0.4);
      border-color: #ef4444;
      color: #fff;
    }
    .btn-card-stand {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      font-size: 0.62rem;
      font-weight: 700;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
      margin-top: 3px;
      transition: all 0.15s ease;
      display: inline-block;
    }
    .btn-card-stand:hover {
      background: #ef4444;
      color: #fff;
    }

    /* Center Toast Banner */
    .center-banner {
      position: absolute;
      top: 116px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 15, 29, 0.88);
      border: 1px solid rgba(250, 204, 21, 0.4);
      border-radius: 30px;
      padding: 7px 22px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      z-index: 20;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }
    .center-banner.last-call {
      border-color: #ef4444;
      background: rgba(45, 10, 15, 0.95);
      box-shadow: 0 0 26px rgba(239, 68, 68, 0.8);
      animation: alertPulse 0.5s infinite alternate ease-in-out;
    }
    @keyframes alertPulse {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.04); }
    }

    /* Pull Rope Floating Visual Hint */
    .rope-hint-tag {
      position: absolute;
      top: 220px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.85);
      border: 1px solid #fde047;
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 20;
      animation: hintFloat 1.2s infinite alternate ease-in-out;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
    }
    @keyframes hintFloat {
      0% { transform: translate(-50%, 0); }
      100% { transform: translate(-50%, 6px); }
    }

    /* Bottom Carnival Control Deck */
    .carnival-controls-deck {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 960px;
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.94) 0%, rgba(10, 14, 26, 0.98) 100%);
      border: 2px solid rgba(250, 204, 21, 0.4);
      border-radius: 18px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75), inset 0 0 20px rgba(250, 204, 21, 0.08);
      z-index: 40;
    }

    /* Total Stake & Live Outcome Row */
    .deck-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.82rem;
    }

    .stakes-summary {
      display: flex;
      gap: 12px;
      align-items: center;
      font-family: var(--font-mono);
    }

    .color-chip-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 0.75rem;
      border: 1px solid;
    }

    /* Controls Bar */
    .deck-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Chip Selector Group */
    .chip-selector-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 0.78rem;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    .chip-btn:hover {
      transform: translateY(-3px) scale(1.08);
    }
    .chip-btn.active {
      border: 3px solid #fff;
      transform: translateY(-5px) scale(1.15);
      box-shadow: 0 0 16px currentColor;
    }

    .chip-10   { background: radial-gradient(circle, #38bdf8 40%, #0284c7 100%); color: #fff; }
    .chip-50   { background: radial-gradient(circle, #34d399 40%, #059669 100%); color: #fff; }
    .chip-100  { background: radial-gradient(circle, #f43f5e 40%, #e11d48 100%); color: #fff; }
    .chip-500  { background: radial-gradient(circle, #a855f7 40%, #7e22ce 100%); color: #fff; }
    .chip-1000 { background: radial-gradient(circle, #facc15 40%, #ca8a04 100%); color: #000; }

    /* Action Buttons */
    .quick-actions-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-quick {
      padding: 8px 14px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-quick:hover {
      background: rgba(250, 204, 21, 0.15);
      border-color: var(--gold);
      color: #fff;
    }

    /* Big Main Action Button */
    .btn-main-drop {
      padding: 10px 24px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 2px solid #fde047;
      border-radius: 12px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.45);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-main-drop:hover:not(:disabled) {
      transform: scale(1.04);
      box-shadow: 0 0 32px rgba(245, 158, 11, 0.7);
    }
    .btn-main-drop:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Celebration Banner */
    .celebration-overlay {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      background: radial-gradient(circle, rgba(234, 179, 8, 0.95) 0%, rgba(180, 83, 9, 0.98) 100%);
      border: 3px solid #fff;
      border-radius: 20px;
      padding: 20px 40px;
      color: #fff;
      text-align: center;
      box-shadow: 0 0 50px rgba(250, 204, 21, 0.8);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .celebration-overlay.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .celebration-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .celebration-sub {
      font-family: var(--font-mono);
      font-size: 1.2rem;
      font-weight: 800;
      color: #fef08a;
      margin-top: 4px;
    }

    @media (max-width: 768px) {
      .seats-ribbon { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .seats-container { top: 54px; }
      .center-banner { top: 154px; font-size: 0.78rem; padding: 5px 14px; }
      .rope-hint-tag { top: 235px; }
    }
    @media (max-width: 640px) {
      .game-logo-title { font-size: 0.9rem; }
      .brand-left .btn-nav-back span { display: none; }
      .chip-btn { width: 38px; height: 38px; font-size: 0.7rem; }
      .carnival-controls-deck { padding: 8px 12px; bottom: 8px; }
      .btn-main-drop { padding: 8px 16px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-left">
      <a href="/arcade/" class="btn-nav-back">← <span>Arcadia Lobby</span></a>
      <div class="game-logo-title">🎪 PERYA COLOR GAME 3D</div>
    </div>
    <div class="nav-hud-right">
      <div class="hud-balance-pill">
        <span>💰</span>
        <span id="display-wallet">25,000</span>
      </div>
      <button class="btn-hud-icon btn-leave" id="btn-leave-seat" title="Leave seat and spectate" style="display:none;" onclick="standUpFromSeat()">🚪 Stand Up</button>
      <button class="btn-hud-icon" id="btn-ayuda" title="Claim ₱2,000 Ayuda Refill">🎁 Ayuda</button>
      <button class="btn-hud-icon" id="btn-bgm" title="Toggle Fiesta Carnival Music">🎵 Music</button>
      <button class="btn-hud-icon" id="btn-sfx" title="Toggle Sound Effects">🔊</button>
      <button class="btn-hud-icon" id="btn-cam" title="Toggle 3D Camera Angle">🎥 View</button>
    </div>
  </header>

  <!-- Multi-Player Seat Ribbon (Up to 4 Players) -->
  <div class="seats-container">
    <div class="seats-ribbon" id="seats-ribbon"></div>
  </div>

  <!-- Banner & Floating Rope Label -->
  <div class="center-banner" id="status-banner">
    <span>🎪</span>
    <span id="banner-text">Click the 3D colored table squares to place chips, then pull the rope!</span>
  </div>
  <div class="rope-hint-tag" id="rope-hint">▲ PULL ROPE ▲</div>

  <!-- 3D Canvas -->
  <div id="webgl-container"></div>

  <!-- Celebration Popup -->
  <div class="celebration-overlay" id="celeb-modal">
    <div class="celebration-title" id="celeb-title">FIESTA WIN!</div>
    <div class="celebration-sub" id="celeb-sub">+500 COINS</div>
  </div>

  <!-- Bottom Carnival Deck -->
  <div class="carnival-controls-deck">
    <div class="deck-top-row">
      <div class="stakes-summary" id="chips-summary-row">
        <span>Active Bets:</span>
        <span class="color-chip-tag" style="border-color:#ef4444; color:#ef4444">RED: <b id="val-red">0</b></span>
        <span class="color-chip-tag" style="border-color:#facc15; color:#facc15">YEL: <b id="val-yellow">0</b></span>
        <span class="color-chip-tag" style="border-color:#3b82f6; color:#3b82f6">BLU: <b id="val-blue">0</b></span>
        <span class="color-chip-tag" style="border-color:#10b981; color:#10b981">GRN: <b id="val-green">0</b></span>
        <span class="color-chip-tag" style="border-color:#f8fafc; color:#f8fafc">WHT: <b id="val-white">0</b></span>
        <span class="color-chip-tag" style="border-color:#ec4899; color:#ec4899">PNK: <b id="val-pink">0</b></span>
      </div>
      <div style="font-family: var(--font-mono); color: #94a3b8;">
        Total: <span id="total-staked-val" style="color:#fff; font-weight:800;">0</span>
      </div>
    </div>

    <div class="deck-bottom-row">
      <!-- Chips -->
      <div class="chip-selector-group">
        <button class="chip-btn chip-10" data-val="10">10</button>
        <button class="chip-btn chip-50 active" data-val="50">50</button>
        <button class="chip-btn chip-100" data-val="100">100</button>
        <button class="chip-btn chip-500" data-val="500">500</button>
        <button class="chip-btn chip-1000" data-val="1000">1K</button>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions-group">
        <button class="btn-quick" id="btn-clear">✕ Clear</button>
        <button class="btn-quick" id="btn-double">2x Double</button>
      </div>

      <!-- Main Action -->
      <button class="btn-main-drop" id="btn-drop">
        <span>🎪 HILAHIN ANG LUBID / DROP CUBES</span>
      </button>
    </div>
  </div>

  <audio id="bgm-player" src="audio/bgm_perya.mp3" loop preload="none"></audio>

  <!-- =========================================================================
       3D WEBGL ENGINE & PERYA CARNIVAL LOGIC
       ========================================================================= -->
  <script>
    'use strict';

    /* --- Sound Synthesizer & Audio Engine --- */
    class PeryaAudio {
      constructor() {
        this.ctx = null;
        this.sfxMuted = localStorage.getItem('perya_sfx_muted') === '1';
        this.bgmMuted = localStorage.getItem('perya_bgm_muted') === '1';
        this.bgmEl = document.getElementById('bgm-player');
      }

      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleSFX() {
        this.sfxMuted = !this.sfxMuted;
        localStorage.setItem('perya_sfx_muted', this.sfxMuted ? '1' : '0');
        return !this.sfxMuted;
      }

      toggleBGM() {
        this.bgmMuted = !this.bgmMuted;
        localStorage.setItem('perya_bgm_muted', this.bgmMuted ? '1' : '0');
        if (this.bgmMuted) {
          this.bgmEl.pause();
        } else {
          this.bgmEl.volume = 0.45;
          this.bgmEl.play().catch(() => {});
        }
        return !this.bgmMuted;
      }

      woodClack(pitch = 1.0) {
        if (this.sfxMuted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(45 * pitch, now + 0.08);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      }

      chip() {
        if (this.sfxMuted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1900 + Math.random() * 400, now);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }

      ropePull() {
        if (this.sfxMuted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Wood creak & rope strain
        for (let i = 0; i < 3; i++) {
          setTimeout(() => {
            if (!this.ctx) return;
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(280 + i * 40, t);
            osc.frequency.exponentialRampToValueAtTime(110, t + 0.12);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.12);
          }, i * 45);
        }
      }

      fanfare(level = 1) {
        if (this.sfxMuted) return;
        this.init();
        if (!this.ctx) return;
        const freqs = level >= 3 ? [523, 659, 783, 1046, 1318] : (level === 2 ? [523, 659, 783, 1046] : [523, 659, 783]);
        const now = this.ctx.currentTime;
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + idx * 0.08);
          gain.gain.setValueAtTime(0.25, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.4);
        });
      }
    }

    function createPeryaFaceTexture(colorHex, name) {
      const cv = document.createElement('canvas');
      cv.width = 256;
      cv.height = 256;
      const ctx = cv.getContext('2d');

      // Base Solid Perya Color
      ctx.fillStyle = colorHex;
      ctx.fillRect(0, 0, 256, 256);

      // Subtle wood grain / carnival finish
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      for (let i = 0; i < 256; i += 8) {
        ctx.fillRect(0, i, 256, 3);
      }

      // Border insets
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 10;
      ctx.strokeRect(10, 10, 236, 236);

      ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.lineWidth = 4;
      ctx.strokeRect(18, 18, 220, 220);

      // Iconic Central White Circle Emblem
      ctx.beginPath();
      ctx.arc(128, 128, 54, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 8;
      ctx.fill();

      // Inner ring
      ctx.beginPath();
      ctx.arc(128, 128, 38, 0, Math.PI * 2);
      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 8;
      ctx.stroke();

      const tex = new THREE.CanvasTexture(cv);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

      clear3DChips();
      players.forEach((p, sIdx) => {
        if ((p.isUser || p.ref) && p.bets) {
          Object.keys(p.bets).forEach(colId => {
            const amt = p.bets[colId] || 0;
            if (amt > 0) {
              const chipCount = Math.min(Math.max(1, Math.floor(amt / 100)), 5);
              for (let i = 0; i < chipCount; i++) {
                addChipTo3DTable(colId, amt, sIdx);
              }
            }
          });
        }
      });
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    /* --- Multi-Player Seats Rendering & Interaction --- */
    function renderSeats() {
      const ribbonEl = document.getElementById('seats-ribbon');
      if (!ribbonEl) return;
      ribbonEl.innerHTML = '';

      const topLeaveBtn = document.getElementById('btn-leave-seat');
      if (topLeaveBtn) {
        topLeaveBtn.style.display = (activeSeat !== -1) ? 'inline-flex' : 'none';
      }

      players.forEach((p, idx) => {
        const tmpl = SEAT_TEMPLATES[idx];
        const cardEl = document.createElement('div');
        cardEl.className = 'seat-card';
        cardEl.id = `seat-card-${idx}`;

        const isLocalUser = (idx === activeSeat && activeSeat !== -1);
        const isOccupied = (p.ref && !isLocalUser);

        if (isLocalUser) {
          cardEl.classList.add('active-user');
        } else if (isOccupied) {
          cardEl.classList.add('occupied');
        } else {
          cardEl.classList.add('open-seat');
        }

        const avatar = isLocalUser ? (p.avatar || tmpl.avatar) : (isOccupied ? (p.avatar || tmpl.avatar) : '💺');
        const name = isLocalUser ? userName : (isOccupied ? p.name : 'Open Seat');

        let totalBet = 0;
        const betDots = [];
        if (p.bets) {
          Object.keys(p.bets).forEach(colId => {
            const amt = p.bets[colId] || 0;
            if (amt > 0) {
              totalBet += amt;
              const colHex = PERYA_COLORS.find(c => c.id === colId)?.hex || '#fff';
              betDots.push(`<span class="chip-dot" style="background:${colHex};" title="${colId}: ₱${amt}"></span>`);
            }
          });
        }

        let statusText = '';
        let standBtnHtml = '';
        if (isLocalUser) {
          statusText = isRolling ? 'Rolling...' : (totalBet > 0 ? `₱${p.balance.toLocaleString()} • Seated` : `₱${p.balance.toLocaleString()} • Seated`);
          standBtnHtml = `<button class="btn-card-stand" onclick="event.stopPropagation(); standUpFromSeat();">🚪 Leave Seat</button>`;
        } else if (isOccupied) {
          statusText = `₱${p.balance.toLocaleString()} • Online`;
        } else {
          statusText = 'Click to Sit';
        }

        cardEl.innerHTML = `
          <div class="seat-meta">
            <div class="seat-avatar" style="border: 2px solid ${tmpl.color}">${avatar}</div>
            <div>
              <div class="seat-name" style="color: ${tmpl.color}">${escapeHtml(name)}</div>
              <div class="seat-status">${statusText}</div>
              ${standBtnHtml}
            </div>
          </div>
          <div>
            <div class="seat-bet-val" style="color: ${totalBet > 0 ? tmpl.color : '#94a3b8'}">${totalBet > 0 ? '₱' + totalBet.toLocaleString() : (isOccupied || isLocalUser ? 'No Bet' : 'Empty')}</div>
            <div class="seat-chip-dots">${betDots.join('')}</div>
          </div>
        `;

        cardEl.onclick = () => {
          if (isRolling) return;
          if (isLocalUser) {
            standUpFromSeat();
          } else if (!isOccupied) {
            switchPlayerSeat(idx);
          }
        };

        ribbonEl.appendChild(cardEl);
      });
    }

    function switchPlayerSeat(seatIdx) {
      if (isRolling) return;
      if (seatIdx < 0 || seatIdx >= 4) return;
      if (activeSeat === seatIdx) return;

      let carriedBets = { red: 0, yellow: 0, blue: 0, green: 0, white: 0, pink: 0 };
      if (activeSeat !== -1 && players[activeSeat]) {
        carriedBets = Object.assign({}, players[activeSeat].bets);
        players[activeSeat].isUser = false;
        players[activeSeat].ref = null;
        players[activeSeat].name = 'Open Seat';
        players[activeSeat].bets = { red: 0, yellow: 0, blue: 0, green: 0, white: 0, pink: 0 };
        players[activeSeat].balance = 0;
      }

      activeSeat = seatIdx;
      const tmpl = SEAT_TEMPLATES[seatIdx];
      players[seatIdx] = {
        seat: seatIdx,
        isUser: true,
        ref: userRef,
        name: userName,
        avatar: tmpl.avatar,
        balance: wallet.get(),
        bets: carriedBets
      };

      try {
        sessionStorage.setItem('perya_color_seat', seatIdx.toString());
      } catch (e) {}

      sound.chip();
      renderSeats();
      updateStakesUI();
      rebuildAll3DChips();
      syncRoomHeartbeat();
      showBanner(`Seated at ${tmpl.defaultName}! Place chips on colored pads.`);
    }

    function standUpFromSeat() {
      if (isRolling) return;
      if (activeSeat === -1) return;

      let totalRefund = 0;
      if (players[activeSeat] && players[activeSeat].bets) {
        Object.keys(players[activeSeat].bets).forEach(k => {
          totalRefund += players[activeSeat].bets[k] || 0;
          players[activeSeat].bets[k] = 0;
        });
      }
      if (totalRefund > 0) {
        wallet.add(totalRefund);
      }

      players[activeSeat].isUser = false;
      players[activeSeat].ref = null;
      players[activeSeat].name = 'Open Seat';
      players[activeSeat].bets = { red: 0, yellow: 0, blue: 0, green: 0, white: 0, pink: 0 };
      players[activeSeat].balance = 0;
      activeSeat = -1;

      try {
        sessionStorage.setItem('perya_color_seat', '-1');
      } catch (e) {}

      sound.woodClack(0.9);
      renderSeats();
      updateStakesUI();
      rebuildAll3DChips();
      syncRoomHeartbeat();
      showBanner('Spectating mode. Click any open seat to join the game!');
    }

    /* --- Raycasting for 3D Table & Rope Interaction --- */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onPointerDown(e) {
      if (isRolling) return;
      // Exclude clicks on UI elements
      if (e.target.closest('.carnival-controls-deck') || e.target.closest('header') || e.target.closest('.seats-container')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([...padMeshes, tassel], true);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        if (hit.userData && hit.userData.isPad) {
          const colId = hit.userData.colorId;
          placeBet(colId);
        } else if (hit.userData && hit.userData.isRope) {
          triggerDropCubes();
        }
      }
    }

    window.addEventListener('pointerdown', onPointerDown);

    /* --- Betting Logic --- */
    function placeBet(colorId) {
      if (isRolling) return;
      if (activeSeat === -1 || !players[activeSeat]) {
        showBanner('⚠️ Click an open seat in the top bar to sit down and play!');
        sound.woodClack(0.6);
        return;
      }
      if (wallet.deduct(currentChip)) {
        players[activeSeat].bets[colorId] = (players[activeSeat].bets[colorId] || 0) + currentChip;
        players[activeSeat].balance = wallet.get();
        sound.chip();
        addChipTo3DTable(colorId, currentChip, activeSeat);
        updateStakesUI();
        renderSeats();
        syncRoomHeartbeat();

        // Flash pad emissive
        const padMesh = padMeshes.find(p => p.userData.colorId === colorId);
        if (padMesh) {
          padMesh.material.emissiveIntensity = 0.6;
          setTimeout(() => padMesh.material.emissiveIntensity = 0.08, 180);
        }
      } else {
        showBanner('❌ Not enough coins! Claim ₱2,000 Ayuda refill at the top.');
        sound.woodClack(0.6);
      }
    }

    function updateStakesUI() {
      let total = 0;
      const userBets = (activeSeat !== -1 && players[activeSeat]) ? players[activeSeat].bets : {};
      PERYA_COLORS.forEach(c => {
        const v = userBets[c.id] || 0;
        total += v;
        const el = document.getElementById(`val-${c.id}`);
        if (el) el.textContent = v.toLocaleString();
      });
      const totalEl = document.getElementById('total-staked-val');
      if (totalEl) totalEl.textContent = total.toLocaleString();
    }

    function clearBets() {
      if (isRolling) return;
      if (activeSeat === -1 || !players[activeSeat]) return;
      let totalRefund = 0;
      Object.keys(players[activeSeat].bets).forEach(k => {
        totalRefund += players[activeSeat].bets[k] || 0;
        players[activeSeat].bets[k] = 0;
      });
      if (totalRefund > 0) {
        wallet.add(totalRefund);
        players[activeSeat].balance = wallet.get();
      }
      rebuildAll3DChips();
      updateStakesUI();
      renderSeats();
      syncRoomHeartbeat();
      sound.chip();
    }

    function doubleBets() {
      if (isRolling) return;
      if (activeSeat === -1 || !players[activeSeat]) return;
      const total = Object.values(players[activeSeat].bets).reduce((a, b) => a + b, 0);
      if (total <= 0) return;
      if (wallet.deduct(total)) {
        Object.keys(players[activeSeat].bets).forEach(k => {
          if (players[activeSeat].bets[k] > 0) {
            players[activeSeat].bets[k] *= 2;
          }
        });
        players[activeSeat].balance = wallet.get();
        rebuildAll3DChips();
        sound.chip();
        updateStakesUI();
        renderSeats();
        syncRoomHeartbeat();
      } else {
        showBanner('❌ Not enough coins to double current bets!');
      }
    }

    let rollSettledFrames = 0;
    let rollStartTime = 0;
    let lastCallTimer = null;
    let lastCallSecondsRemaining = 0;
    let lastCallActive = false;

    function countActivePlayers() {
      let count = 0;
      players.forEach((p, idx) => {
        if (idx === activeSeat && activeSeat !== -1) count++;
        else if (p.ref) count++;
      });
      return count;
    }

    /* --- Drop 3D Cubes (Hilahin ang Lubid) --- */
    function triggerDropCubes() {
      if (isRolling || lastCallActive) return;

      let anyBetPlaced = false;
      players.forEach(p => {
        if (p.bets && Object.values(p.bets).some(v => v > 0)) {
          anyBetPlaced = true;
        }
      });
      if (!anyBetPlaced) {
        showBanner('⚠️ Place chips on at least one color before pulling the rope!');
        sound.woodClack(0.6);
        return;
      }

      const puller = (activeSeat !== -1 && players[activeSeat]) ? players[activeSeat].name : userName;
      const numPlayers = countActivePlayers();

      // If multiplayer (more than 1 seated player): start 5-second Last Call countdown so others aren't cut off!
      if (numPlayers > 1) {
        initiateServerPull(puller);
        startLastCallCountdown(puller, 5);
      } else {
        // Solo player: execute drop immediately!
        executeDropCubes();
      }
    }

    async function initiateServerPull(pullerName) {
      try {
        await fetch('/color_game/api.php?action=initiate_pull', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ puller_name: pullerName })
        });
      } catch (e) {}
    }

    function startLastCallCountdown(pullerName, seconds = 5) {
      if (lastCallActive || isRolling) return;
      lastCallActive = true;
      lastCallSecondsRemaining = seconds;

      const dropBtn = document.getElementById('btn-drop');
      if (dropBtn) dropBtn.disabled = true;

      const banner = document.getElementById('status-banner');
      if (banner) banner.classList.add('last-call');

      sound.fanfare(1);
      showBanner(`🚨 LAST CALL: ${escapeHtml(pullerName)} pulled the rope! Cubes drop in ${lastCallSecondsRemaining}s... Place final bets!`);

      if (lastCallTimer) clearInterval(lastCallTimer);
      lastCallTimer = setInterval(() => {
        lastCallSecondsRemaining--;
        if (lastCallSecondsRemaining > 0) {
          sound.woodClack(1.2);
          showBanner(`🚨 LAST CALL: ${escapeHtml(pullerName)} pulled the rope! Cubes drop in ${lastCallSecondsRemaining}s... Place final bets!`);
          if (dropBtn) dropBtn.textContent = `⏳ DROPPING (${lastCallSecondsRemaining}s)`;
        } else {
          clearInterval(lastCallTimer);
          lastCallTimer = null;
          lastCallActive = false;
          if (banner) banner.classList.remove('last-call');
          if (dropBtn) dropBtn.textContent = '🎲 Hilahin ang Lubid (Pull Rope)';
          executeDropCubes();
        }
      }, 1000);
    }

    function executeDropCubes() {
      if (isRolling) return;
      isRolling = true;
      rollEvaluated = false;
      rollSettledFrames = 0;
      rollStartTime = performance.now();
      document.getElementById('btn-drop').disabled = true;
      sound.ropePull();

      // Animate Rope Pull & Trapdoor Flap
      let ropePullAnim = 0;
      const pullInterval = setInterval(() => {
        ropePullAnim += 0.15;
        ropeGroup.position.y = 0.2 - Math.sin(ropePullAnim) * 0.45;
        trapdoor.rotation.x = Math.sin(ropePullAnim) * 1.2;
        if (ropePullAnim >= Math.PI) {
          clearInterval(pullInterval);
          ropeGroup.position.y = 0.2;
          trapdoor.rotation.x = 0;
        }
      }, 25);

      showBanner('🎪 Cubes tumbling out of the chute with real physics...');

      // Spawn cubes inside the top chute hopper with randomized downward drops and chaotic tumble torques
      diceState.forEach((d, i) => {
        d.body.position.set(
          -1.1 + i * 1.1 + (Math.random() - 0.5) * 0.3,
          3.6 + i * 0.3,
          -0.5 + (Math.random() - 0.5) * 0.3
        );
        d.body.quaternion.setFromEuler(
          Math.random() * Math.PI * 2,
          Math.random() * Math.PI * 2,
          Math.random() * Math.PI * 2
        );
        d.body.velocity.set(
          (Math.random() - 0.5) * 1.8,
          -3.0 - Math.random() * 1.5,
          0.5 + (Math.random() - 0.5) * 1.2
        );
        d.body.angularVelocity.set(
          (Math.random() - 0.5) * 22,
          (Math.random() - 0.5) * 22,
          (Math.random() - 0.5) * 22
        );
      });
    }

    function finishPhysicalRoll() {
      if (rollEvaluated) return;
      rollEvaluated = true;
      const winningColors = diceState.map(d => getPhysicalTopColor(d.body));
      evaluateRoll(winningColors);
    }

    function evaluateRoll(winningColors) {
      lastCallActive = false;
      if (lastCallTimer) {
        clearInterval(lastCallTimer);
        lastCallTimer = null;
      }
      const banner = document.getElementById('status-banner');
      if (banner) banner.classList.remove('last-call');

      const counts = {};
      winningColors.forEach(c => counts[c] = (counts[c] || 0) + 1);

      const colorNames = winningColors.map(id => PERYA_COLORS.find(c => c.id === id).name.split(' ')[0]).join(' • ');
      const maxMatch = Math.max(...Object.values(counts));

      let userWon = 0;
      let multiWinners = [];

      // Payout calculation for each seated real player (Seats 0 to 3)
      players.forEach((p, idx) => {
        if ((p.isUser || p.ref) && p.bets) {
          let seatWon = 0;
          Object.keys(p.bets).forEach(colId => {
            if (counts[colId] && p.bets[colId] > 0) {
              const winMultiplier = 1 + counts[colId];
              seatWon += p.bets[colId] * winMultiplier;
            }
          });

          if (seatWon > 0) {
            p.balance += seatWon;
            if (p.isUser && idx === activeSeat) {
              userWon = seatWon;
              wallet.add(seatWon);
            }
            multiWinners.push({ name: p.name, won: seatWon, seatIdx: idx });

            // Highlight winning seat card
            const card = document.getElementById(`seat-card-${idx}`);
            if (card) {
              card.classList.add('winner-glow');
              setTimeout(() => card.classList.remove('winner-glow'), 3200);
            }
          }
        }
      });

      // Glow winning 3D table pads
      PERYA_COLORS.forEach(c => {
        if (counts[c.id]) {
          const pad = padMeshes.find(p => p.userData.colorId === c.id);
          if (pad) {
            pad.material.emissiveIntensity = 0.9;
            setTimeout(() => pad.material.emissiveIntensity = 0.08, 1600);
          }
        }
      });

      // User celebration & audio
      if (userWon > 0) {
        sound.fanfare(maxMatch);
        showCelebration(
          maxMatch >= 3 ? '🎉 TRIPLE FIESTA JACKPOT!' : (maxMatch === 2 ? '🔥 DOUBLE COLOR WIN!' : '✨ WINNER!'),
          `+₱${userWon.toLocaleString()}`
        );
        showBanner(`🏆 YOU WON ₱${userWon.toLocaleString()}! Outcome: (${colorNames})`);
      } else if (multiWinners.length > 0) {
        sound.fanfare(1);
        const winList = multiWinners.map(w => `${w.name} (+₱${w.won.toLocaleString()})`).join(', ');
        showBanner(`Outcome: (${colorNames}) — Winners: ${winList}`);
      } else {
        sound.woodClack(0.7);
        showBanner(`Outcome: ${colorNames} — No match this round. Hilahin ulit!`);
      }

      broadcastRollResult(winningColors);

      // Clear bets across all players
      players.forEach(p => {
        if (p.bets) {
          Object.keys(p.bets).forEach(k => p.bets[k] = 0);
        }
      });
      clear3DChips();
      updateStakesUI();
      renderSeats();

      isRolling = false;
      document.getElementById('btn-drop').disabled = false;
      document.getElementById('btn-drop').textContent = '🎲 Hilahin ang Lubid (Pull Rope)';
    }

    let lastSeenRollId = 0;

    async function broadcastRollResult(winningColors) {
      try {
        const puller = (activeSeat !== -1 && players[activeSeat]) ? players[activeSeat].name : 'Spectator';
        await fetch('/color_game/api.php?action=broadcast_roll', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            winning_colors: winningColors,
            puller_name: puller,
            roll_id: Date.now()
          })
        });
      } catch (e) {}
    }

    async function syncRoomHeartbeat() {
      try {
        const localBets = (activeSeat !== -1 && players[activeSeat]) ? players[activeSeat].bets : {};
        const payload = {
          ref: userRef,
          name: userName,
          avatar: (activeSeat !== -1 && players[activeSeat]) ? players[activeSeat].avatar : '👑',
          seat: activeSeat,
          bets: localBets,
          balance: wallet.get()
        };

        const res = await fetch('/color_game/api.php?action=join_or_heartbeat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data && data.seats && Array.isArray(data.seats)) {
          let remoteChanged = false;
          data.seats.forEach((serverSeat, idx) => {
            if (idx === activeSeat && activeSeat !== -1) {
              players[idx].ref = userRef;
              players[idx].name = userName;
              players[idx].isUser = true;
              players[idx].balance = wallet.get();
            } else if (serverSeat && serverSeat.ref) {
              if (serverSeat.ref === userRef && idx !== activeSeat) {
                players[idx].ref = null;
                players[idx].name = 'Open Seat';
                players[idx].avatar = SEAT_TEMPLATES[idx].avatar;
                players[idx].isUser = false;
                players[idx].bets = { red: 0, yellow: 0, blue: 0, green: 0, white: 0, pink: 0 };
                players[idx].balance = 0;
                remoteChanged = true;
              } else {
                players[idx].ref = serverSeat.ref;
                players[idx].name = serverSeat.name;
                players[idx].avatar = serverSeat.avatar || SEAT_TEMPLATES[idx].avatar;
                players[idx].isUser = false;
                players[idx].balance = serverSeat.balance || 0;
                players[idx].bets = serverSeat.bets || { red: 0, yellow: 0, blue: 0, green: 0, white: 0, pink: 0 };
                remoteChanged = true;
              }
            } else if (idx !== activeSeat) {
              if (players[idx].ref !== null) {
                players[idx].ref = null;
                players[idx].name = 'Open Seat';
                players[idx].avatar = SEAT_TEMPLATES[idx].avatar;
                players[idx].isUser = false;
                players[idx].bets = { red: 0, yellow: 0, blue: 0, green: 0, white: 0, pink: 0 };
                players[idx].balance = 0;
                remoteChanged = true;
              }
            }
          });
          renderSeats();
          if (remoteChanged && !isRolling) {
            rebuildAll3DChips();
          }
        }

        // Check synchronized pull initiation from remote player
        if (data && data.pull_initiated && data.pull_initiated.drop_time) {
          const remainingSecs = Math.max(1, Math.round(data.pull_initiated.drop_time - data.server_time));
          if (!isRolling && !lastCallActive && remainingSecs > 0 && remainingSecs <= 6) {
            startLastCallCountdown(data.pull_initiated.puller_name, remainingSecs);
          }
        }

        if (data && data.last_roll && data.last_roll.roll_id) {
          if (lastSeenRollId === 0) {
            lastSeenRollId = data.last_roll.roll_id;
          } else if (data.last_roll.roll_id !== lastSeenRollId && !isRolling) {
            lastSeenRollId = data.last_roll.roll_id;
            showBanner(`🎪 ${data.last_roll.puller_name} rolled: ${data.last_roll.winning_colors.join(' • ')}`);
          }
        }
      } catch (e) {}
    }

    function showBanner(msg) {
      document.getElementById('banner-text').textContent = msg;
    }

    function showCelebration(title, sub) {
      const modal = document.getElementById('celeb-modal');
      document.getElementById('celeb-title').textContent = title;
      document.getElementById('celeb-sub').textContent = sub;
      modal.classList.add('active');
      setTimeout(() => modal.classList.remove('active'), 2400);
    }

    /* --- Event Listeners --- */
    document.querySelectorAll('.chip-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentChip = parseInt(btn.dataset.val, 10);
        sound.chip();
      };
    });

    document.getElementById('btn-clear').onclick = clearBets;
    document.getElementById('btn-double').onclick = doubleBets;
    document.getElementById('btn-drop').onclick = triggerDropCubes;

    const AYUDA_COOLDOWN_MS = 60 * 60 * 1000; // 1 hour cooldown

    function getAyudaCooldownRemaining() {
      const last = parseInt(localStorage.getItem('arcade_last_ayuda_timestamp') || localStorage.getItem('jtrash_last_ayuda_timestamp') || '0', 10);
      const elapsed = Date.now() - last;
      return Math.max(0, AYUDA_COOLDOWN_MS - elapsed);
    }

    function updateAyudaBtnTimer() {
      const btn = document.getElementById('btn-ayuda');
      if (!btn) return;
      const rem = getAyudaCooldownRemaining();
      if (rem > 0) {
        const mins = Math.floor(rem / 60000);
        const secs = Math.floor((rem % 60000) / 1000);
        btn.textContent = `⏳ ${mins}m ${secs}s`;
        btn.style.opacity = '0.75';
        btn.title = `Next Ayuda in ${mins}m ${secs}s`;
      } else {
        btn.textContent = '🎁 Ayuda';
        btn.style.opacity = '1';
        btn.title = 'Claim ₱2,000 Ayuda Refill';
      }
    }

    document.getElementById('btn-ayuda').onclick = () => {
      const rem = getAyudaCooldownRemaining();
      if (rem > 0) {
        const mins = Math.floor(rem / 60000);
        const secs = Math.floor((rem % 60000) / 1000);
        showBanner(`⏳ Ayuda cooldown active! Next refill in ${mins}m ${secs}s.`);
        sound.woodClack(0.6);
        updateAyudaBtnTimer();
        return;
      }
      const now = Date.now();
      localStorage.setItem('arcade_last_ayuda_timestamp', now.toString());
      localStorage.setItem('jtrash_last_ayuda_timestamp', now.toString());
      wallet.add(2000);
      sound.fanfare(1);
      showBanner('🎁 ₱2,000 Free Ayuda Coins claimed! Next claim in 1 hour.');
      updateAyudaBtnTimer();
    };

    document.getElementById('btn-sfx').onclick = (e) => {
      const on = sound.toggleSFX();
      e.target.textContent = on ? '🔊' : '🔇';
    };

    document.getElementById('btn-bgm').onclick = (e) => {
      const on = sound.toggleBGM();
      e.target.style.color = on ? '#facc15' : '#94a3b8';
    };

    let camMode = 0;
    document.getElementById('btn-cam').onclick = () => {
      camMode = (camMode + 1) % 2;
      if (camMode === 1) {
        camera.position.set(0, 9.8, 1.2);
        controls.target.set(0, 0, 0);
      } else {
        camera.position.set(0, 7.2, 7.8);
        controls.target.set(0, 1.2, 0);
      }
    };

    // Initial render & room heartbeat polling
    renderSeats();
    updateStakesUI();
    setInterval(syncRoomHeartbeat, 2500);
    setTimeout(syncRoomHeartbeat, 250);
    setInterval(updateAyudaBtnTimer, 1000);
    updateAyudaBtnTimer();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* --- Animation / Physics Loop --- */
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);

      controls.update();

      // Step Cannon.js Physics with fixed sub-stepping to prevent tunneling
      physicsWorld.step(1 / 60, delta, 8);

      // Floor safety clamp: keep cubes on the table
      diceState.forEach(d => {
        if (d.body.position.y < 0.46) {
          d.body.position.y = 0.54;
          if (d.body.velocity.y < 0) d.body.velocity.y = 0;
        }
        d.mesh.position.copy(d.body.position);
        d.mesh.quaternion.copy(d.body.quaternion);
      });

      // Detect natural physical settlement
      if (isRolling && !rollEvaluated) {
        let allStopped = true;
        for (const d of diceState) {
          const speedSq = d.body.velocity.lengthSquared();
          const angSpeedSq = d.body.angularVelocity.lengthSquared();
          if (speedSq > 0.008 || angSpeedSq > 0.02 || d.body.position.y > 1.2) {
            allStopped = false;
            break;
          }
        }

        const elapsed = (performance.now() - rollStartTime) / 1000;
        if (allStopped && elapsed > 1.0) {
          rollSettledFrames++;
          if (rollSettledFrames > 12) {
            finishPhysicalRoll();
          }
        } else if (elapsed > 4.5) {
          finishPhysicalRoll();
        } else {
          rollSettledFrames = 0;
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
</head>
<body>
<script>
  const loader = new THREE.GLTFLoader();
  loader.load('Hand_Nails_low_R.gltf', (gltf) => {
    const root = gltf.scene;
    const bones = {};
    root.traverse(n => { if (n.isBone) bones[n.name] = n; });
    root.updateMatrixWorld(true);
    const palmPos = new THREE.Vector3();
    bones['Palm_R'].getWorldPosition(palmPos);
    const indexTip = new THREE.Vector3();
    bones['Index_Tip_R'].getWorldPosition(indexTip);
    console.log('Palm pos:', palmPos.x.toFixed(4), palmPos.y.toFixed(4), palmPos.z.toFixed(4));
    console.log('Index tip:', indexTip.x.toFixed(4), indexTip.y.toFixed(4), indexTip.z.toFixed(4));
  });
</script>
</body>
</html>

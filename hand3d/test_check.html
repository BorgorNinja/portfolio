<!DOCTYPE html>
<html>
<head>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
</head>
<body>
<script>
  const loader = new THREE.GLTFLoader();
  loader.load('Hand_Nails_low_R.gltf', (gltf) => {
    const root = gltf.scene;
    const bones = {};
    root.traverse(n => { if (n.isBone) bones[n.name] = n; });
    
    console.log('Index_Proximal_R:', bones['Index_Proximal_R'] !== undefined);
    console.log('Ring_Proximal_R:', bones['Ring_Proximal_R'] !== undefined);
    console.log('Little_Proximal_R:', bones['Little_Proximal_R'] !== undefined);
  });
</script>
</body>
</html>

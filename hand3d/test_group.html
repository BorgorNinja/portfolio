<!DOCTYPE html>
<html>
<head>
  <style>body { margin: 0; background: #0f1115; }</style>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
</head>
<body>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0f12);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0, 0.35);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(600, 600);
  document.body.appendChild(renderer.domElement);

  const amb = new THREE.AmbientLight(0xffffff, 1.0);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0xfff5e6, 1.5);
  dir.position.set(1, 2, 3);
  scene.add(dir);

  const texLoader = new THREE.TextureLoader();
  const diff = texLoader.load('caucasian_realistic_baseColor.png');
  const norm = texLoader.load('hands_normal.png');

  const loader = new THREE.GLTFLoader();
  loader.load('Hand_Nails_low_R.gltf', (gltf) => {
    const root = gltf.scene;
    
    root.traverse(n => {
      if (n.isMesh) {
        n.material = new THREE.MeshStandardMaterial({
          map: diff,
          normalMap: norm,
          roughness: 0.55,
          metalness: 0.05
        });
      }
    });

    const bones = {};
    root.traverse(n => { if (n.isBone) bones[n.name] = n; });

    // Curl Index
    bones['Index_Proximal_R'].rotation.z += 1.45;
    bones['Index_Intermediate_R'].rotation.z += 1.45;
    bones['Index_Distal_R'].rotation.z += 1.1;

    // Curl Ring
    bones['Ring_Proximal_R'].rotation.z += 1.45;
    bones['Ring_Intermediate_R'].rotation.z += 1.45;
    bones['Ring_Distal_R'].rotation.z += 1.1;

    // Curl Pinky
    bones['Little_Proximal_R'].rotation.z += 1.45;
    bones['Little_Intermediate_R'].rotation.z += 1.45;
    bones['Little_Distal_R'].rotation.z += 1.1;

    // Fold Thumb
    bones['Thumb_Metacarpal_R'].rotation.z += 0.45;
    bones['Thumb_Metacarpal_R'].rotation.y += 0.35;
    bones['Thumb_Proximal_R'].rotation.z += 0.7;
    bones['Thumb_Distal_R'].rotation.z += 0.8;

    // Create wrapper group
    const group = new THREE.Group();
    group.add(root);
    scene.add(group);

    // Orient group upright:
    // First, align hand so palm/back faces camera and fingers point UP:
    root.rotation.set(0, Math.PI / 2, 0);
    group.rotation.set(0, 0, -Math.PI / 2);
    
    const box = new THREE.Box3().setFromObject(group);
    const center = box.getCenter(new THREE.Vector3());
    group.position.sub(center);
    
    renderer.render(scene, camera);
    window.__TEST_DONE__ = true;
  });
</script>
</body>
</html>

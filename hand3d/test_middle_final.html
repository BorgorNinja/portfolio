<!DOCTYPE html>
<html>
<head>
  <style>body { margin: 0; background: #0f1115; }</style>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
</head>
<body>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0f12);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0, 0.35);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(600, 600);
  document.body.appendChild(renderer.domElement);

  // Balanced studio lighting
  const amb = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(amb);
  const keyLight = new THREE.DirectionalLight(0xffeedd, 1.4);
  keyLight.position.set(2, 3, 3);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x8bc34a, 0.3);
  fillLight.position.set(-2, 1, 2);
  scene.add(fillLight);
  const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.9);
  rimLight.position.set(-1, 3, -2);
  scene.add(rimLight);

  const texLoader = new THREE.TextureLoader();
  const diff = texLoader.load('caucasian_realistic_baseColor.png');
  const norm = texLoader.load('hands_normal.png');

  const loader = new THREE.GLTFLoader();
  loader.load('Hand_Nails_low_R.gltf', (gltf) => {
    const root = gltf.scene;
    
    root.traverse(n => {
      if (n.isMesh) {
        n.material = new THREE.MeshStandardMaterial({
          map: diff,
          normalMap: norm,
          roughness: 0.6,
          metalness: 0.05
        });
      }
    });

    const bones = {};
    root.traverse(n => { if (n.isBone) bones[n.name] = n; });

    // Curl into palm with NEGATIVE Z:
    const curl = -1.6;
    bones['Index_Proximal_R'].rotation.z += curl;
    bones['Index_Intermediate_R'].rotation.z += curl;
    bones['Index_Distal_R'].rotation.z += -1.2;

    // Middle finger stays extended straight up:
    bones['Middle_Proximal_R'].rotation.z = 0;
    bones['Middle_Intermediate_R'].rotation.z = 0;
    bones['Middle_Distal_R'].rotation.z = 0;

    bones['Ring_Proximal_R'].rotation.z += curl;
    bones['Ring_Intermediate_R'].rotation.z += curl;
    bones['Ring_Distal_R'].rotation.z += -1.2;

    bones['Little_Proximal_R'].rotation.z += curl;
    bones['Little_Intermediate_R'].rotation.z += curl;
    bones['Little_Distal_R'].rotation.z += -1.2;

    // Thumb folds across the curled fingers
    bones['Thumb_Metacarpal_R'].rotation.z += -0.6;
    bones['Thumb_Metacarpal_R'].rotation.y += 0.5;
    bones['Thumb_Proximal_R'].rotation.z += -0.7;
    bones['Thumb_Distal_R'].rotation.z += -0.8;

    const group = new THREE.Group();
    group.add(root);
    scene.add(group);

    root.rotation.set(0, Math.PI / 2, 0);
    // Angle slightly in 3D perspective to see the middle finger gesture clearly
    group.rotation.set(0.1, 0.35, -Math.PI / 2);
    
    const box = new THREE.Box3().setFromObject(group);
    const center = box.getCenter(new THREE.Vector3());
    group.position.sub(center);
    
    renderer.render(scene, camera);
    window.__TEST_DONE__ = true;
  });
</script>
</body>
</html>

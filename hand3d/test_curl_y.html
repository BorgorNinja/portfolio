<!DOCTYPE html>
<html>
<head>
  <style>body { margin: 0; background: #111; }</style>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
</head>
<body>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111418);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0, 0.35);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(400, 400);
  document.body.appendChild(renderer.domElement);

  const amb = new THREE.AmbientLight(0xffffff, 1.0);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(1, 3, 2);
  scene.add(dir);

  const loader = new THREE.GLTFLoader();
  loader.load('Hand_Nails_low_R.gltf', (gltf) => {
    const root = gltf.scene;
    scene.add(root);
    
    const bones = {};
    root.traverse(n => { if (n.isBone) bones[n.name] = n; });
    
    // Rotate index along y
    bones['Index_Proximal_R'].rotation['y'] += 1.3;
    bones['Index_Intermediate_R'].rotation['y'] += 1.3;
    bones['Index_Distal_R'].rotation['y'] += 1.0;

    root.rotation.set(0, Math.PI / 2, Math.PI + Math.PI / 2);
    
    const box = new THREE.Box3().setFromObject(root);
    const center = box.getCenter(new THREE.Vector3());
    root.position.sub(center);
    
    renderer.render(scene, camera);
    window.__TEST_DONE__ = true;
  });
</script>
</body>
</html>

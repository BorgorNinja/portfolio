<!DOCTYPE html>
<html>
<head>
  <style>body { margin: 0; background: #0f1115; }</style>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
</head>
<body>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0f12);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0.05, 0.35);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(600, 600);
  document.body.appendChild(renderer.domElement);

  const amb = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(amb);
  const keyLight = new THREE.DirectionalLight(0xffeedd, 1.4);
  keyLight.position.set(2, 3, 3);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x8bc34a, 0.3);
  fillLight.position.set(-2, 1, 2);
  scene.add(fillLight);

  const texLoader = new THREE.TextureLoader();
  const diff = texLoader.load('caucasian_realistic_baseColor.png');
  const norm = texLoader.load('hands_normal.png');

  const loader = new THREE.GLTFLoader();
  loader.load('Hand_Nails_low_R.gltf', (gltf) => {
    const root = gltf.scene;
    
    root.traverse(n => {
      if (n.isMesh) {
        n.material = new THREE.MeshStandardMaterial({
          map: diff,
          normalMap: norm,
          roughness: 0.55,
          metalness: 0.05
        });
      }
    });

    const bones = {};
    root.traverse(n => { if (n.isBone) bones[n.name] = n; });

    function curlBone(name, angle) {
      if (!bones[name]) return;
      const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), angle);
      bones[name].quaternion.multiply(q);
    }

    // Curl Index
    curlBone('Index_Proximal_R', 1.4);
    curlBone('Index_Intermediate_R', 1.4);
    curlBone('Index_Distal_R', 1.1);

    // Middle stays straight!

    // Curl Ring
    curlBone('Ring_Proximal_R', 1.4);
    curlBone('Ring_Intermediate_R', 1.4);
    curlBone('Ring_Distal_R', 1.1);

    // Curl Pinky
    curlBone('Little_Proximal_R', 1.4);
    curlBone('Little_Intermediate_R', 1.4);
    curlBone('Little_Distal_R', 1.1);

    // Thumb across
    curlBone('Thumb_Metacarpal_R', 0.6);
    curlBone('Thumb_Proximal_R', 0.7);
    curlBone('Thumb_Distal_R', 0.8);

    const group = new THREE.Group();
    group.add(root);
    scene.add(group);

    root.rotation.set(0, Math.PI / 2, 0);
    group.rotation.set(0.1, 0.35, -Math.PI / 2);
    
    const box = new THREE.Box3().setFromObject(group);
    const center = box.getCenter(new THREE.Vector3());
    group.position.sub(center);
    
    renderer.render(scene, camera);
    window.__TEST_DONE__ = true;
  });
</script>
</body>
</html>

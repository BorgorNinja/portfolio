<!DOCTYPE html>
<html>
<head>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
</head>
<body>
<script>
  const loader = new THREE.GLTFLoader();
  loader.load('Hand_Nails_low_R.gltf', (gltf) => {
    const root = gltf.scene;
    const bones = {};
    root.traverse(n => { if (n.isBone) bones[n.name] = n; });
    
    function getTipPos() {
      root.updateMatrixWorld(true);
      const pos = new THREE.Vector3();
      bones['Index_Tip_R'].getWorldPosition(pos);
      return pos;
    }

    const baseTip = getTipPos();

    for (const val of [1.5, -1.5]) {
      bones['Index_Proximal_R'].rotation.set(0, 0, 0);
      bones['Index_Proximal_R'].rotation.x = val;
      const p = getTipPos();
      const dx = (p.x - baseTip.x).toFixed(4);
      const dy = (p.y - baseTip.y).toFixed(4);
      const dz = (p.z - baseTip.z).toFixed(4);
      console.log('Rot x=' + val + ' -> delta: ' + dx + ', ' + dy + ', ' + dz);
    }
  });
</script>
</body>
</html>

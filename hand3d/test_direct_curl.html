<!DOCTYPE html>
<html>
<head>
  <style>body { margin: 0; background: #0f1115; }</style>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
</head>
<body>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0f12);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0.15, 0.2, 0.35);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(600, 600);
  document.body.appendChild(renderer.domElement);

  const amb = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(amb);
  const keyLight = new THREE.DirectionalLight(0xffeedd, 1.5);
  keyLight.position.set(2, 3, 2);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x8bc34a, 0.4);
  fillLight.position.set(-2, 1, 1);
  scene.add(fillLight);

  const texLoader = new THREE.TextureLoader();
  const diff = texLoader.load('caucasian_realistic_baseColor.png');
  const norm = texLoader.load('hands_normal.png');

  const loader = new THREE.GLTFLoader();
  loader.load('Hand_Nails_low_R.gltf', (gltf) => {
    const root = gltf.scene;
    scene.add(root);
    
    root.traverse(n => {
      if (n.isMesh) {
        n.material = new THREE.MeshStandardMaterial({
          map: diff,
          normalMap: norm,
          roughness: 0.55,
          metalness: 0.05
        });
      }
    });

    const bones = {};
    root.traverse(n => { if (n.isBone) bones[n.name] = n; });

    // Curl Index
    bones['Index_Proximal_R'].rotation.z += 1.4;
    bones['Index_Intermediate_R'].rotation.z += 1.4;
    bones['Index_Distal_R'].rotation.z += 1.0;

    // Ring
    bones['Ring_Proximal_R'].rotation.z += 1.4;
    bones['Ring_Intermediate_R'].rotation.z += 1.4;
    bones['Ring_Distal_R'].rotation.z += 1.0;

    // Pinky
    bones['Little_Proximal_R'].rotation.z += 1.4;
    bones['Little_Intermediate_R'].rotation.z += 1.4;
    bones['Little_Distal_R'].rotation.z += 1.0;

    // Thumb
    bones['Thumb_Metacarpal_R'].rotation.x += 0.5;
    bones['Thumb_Proximal_R'].rotation.z += 0.8;
    bones['Thumb_Distal_R'].rotation.z += 0.8;

    // Keep Middle STRAIGHT!
    
    // Rotate root so hand stands upright
    root.rotation.set(0, 0, Math.PI / 2);

    const box = new THREE.Box3().setFromObject(root);
    const center = box.getCenter(new THREE.Vector3());
    root.position.sub(center);
    
    renderer.render(scene, camera);
    window.__TEST_DONE__ = true;
  });
</script>
</body>
</html>

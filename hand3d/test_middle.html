<!DOCTYPE html>
<html>
<head>
  <style>body { margin: 0; background: #0f1115; }</style>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
</head>
<body>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0f12);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0.05, 0.38);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(800, 800);
  document.body.appendChild(renderer.domElement);

  const amb = new THREE.AmbientLight(0xffffff, 0.9);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0xfff5e6, 1.5);
  dir.position.set(2, 4, 3);
  scene.add(dir);
  const rim = new THREE.DirectionalLight(0x38bdf8, 0.8);
  rim.position.set(-2, 2, -2);
  scene.add(rim);

  const texLoader = new THREE.TextureLoader();
  const diff = texLoader.load('caucasian_realistic_baseColor.png');
  const norm = texLoader.load('hands_normal.png');
  const orm = texLoader.load('hands_occlusionRoughnessMetallic.png');

  const loader = new THREE.GLTFLoader();
  loader.load('Hand_Nails_low_R.gltf', (gltf) => {
    const root = gltf.scene;
    scene.add(root);
    
    root.traverse(n => {
      if (n.isMesh) {
        n.material = new THREE.MeshStandardMaterial({
          map: diff,
          normalMap: norm,
          roughness: 0.55,
          metalness: 0.05
        });
      }
    });

    const bones = {};
    root.traverse(n => { if (n.isBone) bones[n.name] = n; });
    
    // Curl Index
    bones['Index_Proximal_R'].rotation.z += 1.45;
    bones['Index_Intermediate_R'].rotation.z += 1.45;
    bones['Index_Distal_R'].rotation.z += 1.1;

    // Keep Middle STRAIGHT (middle finger!)
    // slightly straighten middle if needed
    bones['Middle_Proximal_R'].rotation.z += 0.05;

    // Curl Ring
    bones['Ring_Proximal_R'].rotation.z += 1.45;
    bones['Ring_Intermediate_R'].rotation.z += 1.45;
    bones['Ring_Distal_R'].rotation.z += 1.1;

    // Curl Pinky
    bones['Little_Proximal_R'].rotation.z += 1.45;
    bones['Little_Intermediate_R'].rotation.z += 1.45;
    bones['Little_Distal_R'].rotation.z += 1.1;

    // Fold Thumb over index/middle knuckle
    // Let's test thumb flexion
    bones['Thumb_Metacarpal_R'].rotation.z += 0.5;
    bones['Thumb_Metacarpal_R'].rotation.y += 0.4;
    bones['Thumb_Proximal_R'].rotation.z += 0.7;
    bones['Thumb_Distal_R'].rotation.z += 0.8;

    // Hand orientation: upright, showing back of hand with middle finger extended
    root.rotation.set(-0.2, Math.PI / 2, Math.PI + Math.PI / 2);
    
    const box = new THREE.Box3().setFromObject(root);
    const center = box.getCenter(new THREE.Vector3());
    root.position.sub(center);
    
    renderer.render(scene, camera);
    window.__TEST_DONE__ = true;
  });
</script>
</body>
</html>

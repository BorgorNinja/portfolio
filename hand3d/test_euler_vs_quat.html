<!DOCTYPE html>
<html>
<head>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
</head>
<body>
<script>
  const loader = new THREE.GLTFLoader();
  loader.load('Hand_Nails_low_R.gltf', (gltf) => {
    const root = gltf.scene;
    const bones = {};
    root.traverse(n => { if (n.isBone) bones[n.name] = n; });
    
    function getTipPos() {
      root.updateMatrixWorld(true);
      const pos = new THREE.Vector3();
      bones['Index_Tip_R'].getWorldPosition(pos);
      return pos;
    }

    const baseTip = getTipPos();

    // 1. Just set rotation.x:
    bones['Index_Proximal_R'].rotation.x = -1.5;
    const p1 = getTipPos();
    console.log('Only rotation.x delta:', (p1.y - baseTip.y).toFixed(4));

    // 2. Set quaternion from Euler:
    bones['Index_Proximal_R'].quaternion.setFromEuler(new THREE.Euler(-1.5, 0, 0));
    const p2 = getTipPos();
    console.log('quaternion.setFromEuler delta:', (p2.y - baseTip.y).toFixed(4));
  });
</script>
</body>
</html>

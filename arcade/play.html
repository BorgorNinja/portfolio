<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Borgor Arcadia • Dedicated Game Theater</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theater.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #06080e;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .play-standalone-wrapper {
      width: 100%;
      max-width: 960px;
    }
    .top-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
    }
    .btn-back-lobby {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="play-standalone-wrapper">
    <div class="top-nav-bar">
      <a href="/arcade/" class="btn-back-lobby">← Return to Arcadia Lobby</a>
      <div id="standalone-title" style="font-weight: 800; font-size: 0.9rem; color: #fde047;">Loading Game...</div>
    </div>
    <div id="game-mount-point"></div>
  </div>

  <script src="games_data.js"></script>
  <script src="casino_engine.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game') || 'blackjack';
    const mount = document.getElementById('game-mount-point');

    const gameDef = ARCADE_GAMES.find(g => g.id === gameId);
    if (gameDef) {
      document.title = `${gameDef.title} • Borgor Arcadia`;
      document.getElementById('standalone-title').textContent = `${gameDef.title} (${gameDef.badge})`;
      window.CasinoEngine.openGame(gameId);
    } else {
      mount.innerHTML = `<div style="text-align:center; padding:40px; color:#ef4444;">Game not found. <a href="/arcade/" style="color:#38bdf8;">Return to lobby</a></div>`;
    }
  </script>
</body>
</html>
